name: Windows installer

on:
  push:
    branches:
      - copilot/windows-installer-full
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ''

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure production environment
        run: Copy-Item packages/app-lib/.env.prod packages/app-lib/.env

      - name: Generate language coverage
        run: pnpm i18n:coverage

      - name: Build Windows installer
        run: pnpm --filter=@modrinth/app run tauri build --config tauri-windows-offline.conf.json --verbose --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Modrinth-App-Windows-Installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
